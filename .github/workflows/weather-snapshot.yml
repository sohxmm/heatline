name: Refresh public weather snapshot
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch weather and retain original issue time on failure
        id: weather
        continue-on-error: true
        run: python scripts/fetch_weather_snapshot.py
      - name: Persist the public cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/heatline/outlook.json frontend/public/data/outlook.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public weather snapshot [skip ci]'
            git push
          fi
      - name: Surface provider failures
        if: steps.weather.outcome == 'failure'
        run: exit 1
